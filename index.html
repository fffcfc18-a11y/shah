<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مصدر الزيارة</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 5px 25px rgba(0,0,0,.1);
    }

    h2 {
      margin-bottom: 15px;
    }

    #domain {
      font-size: 20px;
      font-weight: bold;
      color: #1565c0;
    }
  </style>
</head>

<body>

  <div class="box">
    <h2>تم توجيهك من النطاق:</h2>
    <div id="domain">جاري التحقق...</div>
  </div>

  <script>
    const referrer = document.referrer;

    if (referrer) {
      try {
        const url = new URL(referrer);
        document.getElementById("domain").textContent = url.hostname;
      } catch {
        document.getElementById("domain").textContent = "غير معروف";
      }
    } else {
      document.getElementById("domain").textContent = "لا يوجد نطاق مصدر";
    }
  </script>

</body>
</html>
