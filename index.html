<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>عرض النص من الرابط</title>
</head>
<body>
  <h1 id="output">جارٍ التحميل...</h1>

  <script>
    // يقرأ القيمة من الرابط مثل: page.html?name=مرحبا
    const params = new URLSearchParams(window.location.search);
    const text = params.get('name') || 'لا يوجد نص في الرابط';
    document.getElementById('output').textContent = text;
  </script>
</body>
</html>
